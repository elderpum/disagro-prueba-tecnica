services:
  database:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: disagro-database
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - ./backend/src/database:/scripts
      - disagro_sqlserver_data:/var/opt/mssql
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: disagro-backend
    ports:
      - "${PORT}:${PORT}"
    environment:
      DB_SERVER: "${DB_SERVER}"
      DB_PORT: "${DB_PORT}"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN}"
      NODE_ENV: "${NODE_ENV:-production}"
      PORT: "${PORT}"
    depends_on:
      - database
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${API_URL:-http://localhost:${PORT}/api}
    container_name: disagro-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  disagro_sqlserver_data:
